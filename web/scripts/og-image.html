<!doctype html>
<!--
  Source for `public/og-image.png` (1200x630).
  Regenerate with `npm run og:image --workspace web` after editing.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #05060a;
        font-family: 'Inter', system-ui, sans-serif;
        color: #fff;
      }

      /* Same ambient recipe as the app's BackgroundFX. */
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 78%);
      }
      .aura { position: absolute; border-radius: 9999px; filter: blur(80px); }
      .aura-a { width: 780px; height: 780px; top: -420px; left: 300px; background: radial-gradient(circle, rgba(124, 92, 255, 0.34), transparent 62%); }
      .aura-b { width: 620px; height: 620px; top: 120px; right: -280px; background: radial-gradient(circle, rgba(34, 211, 238, 0.22), transparent 65%); }
      .aura-c { width: 560px; height: 560px; bottom: -340px; left: -180px; background: radial-gradient(circle, rgba(0, 255, 163, 0.16), transparent 65%); }
      .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% -10%, transparent 35%, rgba(5, 6, 10, 0.9) 100%); }

      .stage { position: relative; height: 100%; display: flex; align-items: center; gap: 64px; padding: 0 76px; }
      .copy { flex: 1; min-width: 0; }

      .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 34px; }
      .mark {
        width: 62px; height: 62px; border-radius: 18px;
        background: linear-gradient(135deg, #7c5cff, #22d3ee);
        box-shadow: 0 0 44px -6px rgba(124, 92, 255, 0.9);
        display: flex; align-items: center; justify-content: center;
      }
      .wordmark { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
      .wordmark span { color: #a78bfa; }

      h1 { font-size: 62px; line-height: 1.06; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 22px; }
      h1 em { font-style: normal; color: #a78bfa; }
      p.lede { font-size: 25px; line-height: 1.45; color: rgba(255, 255, 255, 0.55); max-width: 620px; }

      .chips { display: flex; gap: 12px; margin-top: 38px; flex-wrap: wrap; }
      .chip {
        display: inline-flex; align-items: center; gap: 9px;
        padding: 11px 20px; border-radius: 9999px; font-size: 19px; font-weight: 500;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.78);
      }
      .dot { width: 9px; height: 9px; border-radius: 9999px; }

      /* Radar dial, mirroring the app's hero. */
      .dial { position: relative; width: 340px; height: 340px; flex-shrink: 0; }
      .dial .sweep {
        position: absolute; inset: 0; border-radius: 9999px;
        background: conic-gradient(from -96deg, transparent 0deg, transparent 236deg, rgba(34, 211, 238, 0.05) 300deg, rgba(34, 211, 238, 0.34) 358deg, transparent 360deg);
        -webkit-mask-image: radial-gradient(circle, transparent 33%, #000 35%, #000 98%, transparent 100%);
      }
      .dial svg { position: absolute; inset: 0; transform: rotate(-90deg); }
      .dial .readout {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
      }
      .readout .value {
        font-family: 'JetBrains Mono', monospace; font-size: 74px; font-weight: 700;
        color: #22d3ee; text-shadow: 0 0 34px rgba(34, 211, 238, 0.5);
        font-variant-numeric: tabular-nums;
      }
      .readout .caption { margin-top: 8px; font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255, 255, 255, 0.42); }
      .readout .event { margin-top: 16px; font-size: 17px; color: rgba(255, 255, 255, 0.6); }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="aura aura-a"></div>
    <div class="aura aura-b"></div>
    <div class="aura aura-c"></div>
    <div class="vignette"></div>

    <div class="stage">
      <div class="copy">
        <div class="brand">
          <div class="mark">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
              <path d="M12 2a10 10 0 1 0 10 10" />
              <path d="M12 12l6.5-6.5" />
              <circle cx="12" cy="12" r="1.6" fill="#fff" stroke="none" />
            </svg>
          </div>
          <div class="wordmark">Macro<span>Sync</span></div>
        </div>

        <h1>Trade the calendar,<br />not just the <em>chart</em>.</h1>
        <p class="lede">
          Technical signals, a macro-news countdown radar and AI risk management — on one screen.
        </p>

        <div class="chips">
          <div class="chip"><span class="dot" style="background: #00ffa3"></span>28 assets · live Binance data</div>
          <div class="chip"><span class="dot" style="background: #7c5cff"></span>EN · UA</div>
        </div>
      </div>

      <div class="dial">
        <div class="sweep"></div>
        <svg viewBox="0 0 128 128">
          <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
          <circle cx="64" cy="64" r="38" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
          <circle cx="64" cy="64" r="22" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
          <circle
            cx="64" cy="64" r="54" fill="none" stroke="#22d3ee" stroke-width="2.6" stroke-linecap="round"
            stroke-dasharray="248 339" style="filter: drop-shadow(0 0 9px #22d3ee)"
          />
          <circle cx="64" cy="64" r="54" fill="none" stroke="none" />
        </svg>
        <div class="readout">
          <div class="value">92</div>
          <div class="caption">Impact</div>
          <div class="event">US CPI · 01:24:08</div>
        </div>
      </div>
    </div>
  </body>
</html>
